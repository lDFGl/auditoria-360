name: Publicar Auditoria 360 no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validar estrutura publicada
        run: |
          test -f www/index.html
          test -f www/css/styles.css
          test -f www/js/app.js
          test -f www/manifest.webmanifest
      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
