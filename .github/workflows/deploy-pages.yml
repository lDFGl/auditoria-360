name: Publicar Auditoria 360 no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "tests/**"
      - ".github/workflows/validate.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências de teste
        run: npm install --no-audit --no-fund
      - name: Instalar Chromium para testes de PDF
        run: npx playwright install --with-deps chromium
      - name: Verificar JavaScript e executar testes
        run: |
          node --check www/js/app.js
          node --check www/js/storage.js
          node --check www/js/photos.js
          node --check www/js/score.js
          node --check www/sw.js
          npm test
      - name: Verificar arquivos essenciais e dependências offline
        run: |
          test -s www/index.html
          test -s www/css/styles.css
          test -s www/js/app.js
          test -s www/js/vendor/jspdf.umd.min.js
          test -s www/js/score.js
          test -s www/manifest.webmanifest
          test -s www/sw.js
          test -s www/icons/icon-maskable.svg
          node -e 'JSON.parse(require("fs").readFileSync("www/manifest.webmanifest","utf8"))'
  build:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validar estrutura publicada
        run: |
          test -f www/index.html
          test -f www/css/styles.css
          test -f www/js/app.js
          test -f www/js/score.js
          test -f www/sw.js
          test -f www/logo-fg.png
          test -f www/icons/icon-192.svg
          test -f www/icons/icon-512.svg
          test -f www/icons/icon-maskable.svg
          test -s www/fonts/OFL-DM-Sans.txt
          test -s www/fonts/OFL-Manrope.txt
          test -f www/fonts/dm-sans-variable.woff2
          test -f www/fonts/manrope-variable.woff2
          node -e 'JSON.parse(require("fs").readFileSync("www/manifest.webmanifest","utf8"))'
      - name: Versionar cache do Service Worker
        run: sed -i "s/__BUILD_ID__/${GITHUB_SHA}/g" www/sw.js
      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
