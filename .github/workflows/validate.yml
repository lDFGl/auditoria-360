name: Validar código

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar JavaScript
        run: |
          node --check www/js/app.js
          node --check www/js/score.js
          node --check www/sw.js
          node --test tests/*.test.js
      - name: Verificar arquivos essenciais
        run: |
          test -s www/index.html
          test -s www/css/styles.css
          test -s www/js/app.js
          test -s www/js/vendor/html2pdf.bundle.min.js
          test -s www/js/score.js
          test -s www/manifest.webmanifest
          test -s www/fonts/dm-sans-variable.woff2
          test -s www/fonts/manrope-variable.woff2
          test -s www/icons/icon-maskable.svg
          test -s www/fonts/OFL-DM-Sans.txt
          test -s www/fonts/OFL-Manrope.txt
          node -e 'JSON.parse(require("fs").readFileSync("www/manifest.webmanifest","utf8"))'
